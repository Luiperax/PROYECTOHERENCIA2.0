name: Actualizar datos de fútbol

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 minutos (GitHub puede retrasarlo algo)
  workflow_dispatch:          # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: futbol-data
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Obtener datos de LaLiga, Copa del Rey y Champions
        run: python3 Futbol/scripts/fetch_futbol.py

      - name: Publicar cambios si los hay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain Futbol/data.json Futbol/cache.json)" ]; then
            echo "Sin cambios en los datos."
            exit 0
          fi
          git add Futbol/data.json Futbol/cache.json
          git commit -m "Actualizar datos de fútbol [skip ci]"
          # El otro workflow escribe en la misma rama: si se cruzan, hay que
          # reintegrar lo suyo antes de empujar en vez de fallar.
          for intento in 1 2 3 4 5; do
            if git push; then
              echo "Datos publicados (intento $intento)."
              exit 0
            fi
            echo "Push rechazado; reintegrando cambios remotos e intentando de nuevo…"
            git pull --rebase --autostash origin main || exit 1
            sleep $((intento * 3))
          done
          echo "::error::No se pudo publicar tras varios intentos."
          exit 1
