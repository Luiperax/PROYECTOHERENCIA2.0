name: Actualizar datos Mundial 2026

# El Mundial 2026 terminó el 19 de julio de 2026: los 104 partidos están cerrados
# y los datos ya no pueden cambiar. La ejecución programada se ha retirado —seguía
# corriendo cada 15 minutos sin nada que actualizar— y queda solo el disparo manual
# por si alguna vez hiciera falta regenerar el fichero.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mundial-data
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Obtener datos de la FIFA
        run: python3 MundialTracker2026/scripts/fetch_data.py

      - name: Publicar cambios si los hay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain MundialTracker2026/data.json)" ]; then
            echo "Sin cambios en los datos."
            exit 0
          fi
          git add MundialTracker2026/data.json
          git commit -m "Actualizar datos del Mundial 2026 [skip ci]"
          for intento in 1 2 3 4 5; do
            if git push; then
              echo "Datos publicados (intento $intento)."
              exit 0
            fi
            echo "Push rechazado; reintegrando cambios remotos e intentando de nuevo…"
            git pull --rebase --autostash origin main || exit 1
            sleep $((intento * 3))
          done
          echo "::error::No se pudo publicar tras varios intentos."
          exit 1
